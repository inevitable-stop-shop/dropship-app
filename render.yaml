services:
  - type: web
    name: dropship-fulfillment-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /webhooks/health
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
      - key: DATABASE_SSL
        value: true
      - key: APP_ADMIN_PASSWORD
        sync: false
      - key: SHOPIFY_SHOP_DOMAIN
        sync: false
      - key: SHOPIFY_ADMIN_TOKEN
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: APP_BASE_URL
        sync: false
  - type: pserv
    name: dropship-db
    runtime: postgres
    plan: free
    ipAllowList: []